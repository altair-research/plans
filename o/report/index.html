    if (!k) { msg.innerHTML = "이 페이지는 받은 링크로만 열 수 있습니다.<br><small>링크 끝의 #k=… 부분까지 전부 복사했는지 확인하세요.</small>"; return; }
    try {
      const key = await crypto.subtle.importKey("raw", unb64(k), "AES-GCM", false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(DATA.iv) }, key, unb64(DATA.ct));
      // document.open() is ignored while the parser is still running, so wait until it finishes
      if (document.readyState === "loading") await new Promise(r => document.addEventListener("DOMContentLoaded", r));
      document.open(); document.write(new TextDecoder().decode(plain)); document.close();
    } catch (e) {
      msg.innerHTML = "링크가 맞지 않습니다.<br><small>예전 링크이거나 일부가 잘렸을 수 있습니다.</small>";
    }
  })();
</script>
</body>
</html>
