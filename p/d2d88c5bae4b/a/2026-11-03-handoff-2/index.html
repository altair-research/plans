      document.open(); document.write(new TextDecoder().decode(plain)); document.close();
    } catch (e) {
      msg.innerHTML = "링크가 맞지 않습니다.<br><small>예전 링크이거나 일부가 잘렸을 수 있습니다.</small>";
    }
  })();
</script>
</body>
</html>
