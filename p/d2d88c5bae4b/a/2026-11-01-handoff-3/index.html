  const unb64 = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));

    const k = new URLSearchParams(location.hash.slice(1)).get("k");
    const msg = document.getElementById("msg");
