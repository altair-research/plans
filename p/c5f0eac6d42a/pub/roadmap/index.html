<article><p class="stamp">Discovery Lab · 로드맵 공개본 2026-10-26 · 내부 내용은 뺐다</p><div id="doc"></div></article>
<script>
  // 암호를 푼 뒤 document.write 로 그려지는 페이지라 <script src> 는 막힐 수 있다 — 직접 붙이고 실패하면 글자 그대로 보인다
  const MD = "# Roadmap: From Principles to Play\n\n## 진행 현황 (2026-10-26)\n\n| 단계 | 상태 | 남은 것 |\n|---|---|---|\n| M0 기반 | 완료 | — |\n| M1 Flow Lab 시뮬레이션 | 완료 | — |\n| M2 실험 도구·학습 흐름 | 완료 | 안내형 미션은 Motion Lab 주차 미션 1개뿐 |\n| M3 원리·깊이 엔진 | 1차 완료 (10-26) | 랩마다 발견→실험→분석→만들기→더 깊이 탐구 길 25개, 원리 화면·홈에서 바로 열기. 남은 것: 원리 간 선수 개념 그래프, 단계 완료를 화면이 알아보기 |\n| MVP 공개 출시 | 준비 완료, 공개 결정 대기 (목표 10-28) | 안내·개인정보·모델 한계 페이지, 빌드·배포 준비 끝. 공개 뒤 첫 피드백 반영(11-04) |\n| M4 어린이 대상 검증 | 시작 전 | 교육자 검토 자료 `docs/EDUCATOR_REVIEW.md` 준비됨 |\n\n\n\n\n## M0: 프로젝트 기반 (즉시)\n- 별도 새 폴더와 GitHub Repository 준비.\n- `AGENTS.md` 및 `docs/` 문서 이해와 방향 합의.\n- React + TS + Vite 앱 뼈대, README 실행법, 기본 테스트 구성.\n- 초기 24개 Principle Library를 탐색할 수 있는 읽기 전용 화면.\n\n**완료 기준:** 새 앱이 독립적으로 실행됨.\n\n## M1: Flow Lab 시뮬레이션 MVP\n- 아래에서 위로 이동하는 Agent.\n- 좁은 출구, V자 장애물 프리셋, 인원 수 조절.\n- 실제 개별 Agent 상태 업데이트와 충돌 회피.\n- 실행/일시정지/초기화, 지표 시각화.\n- 기본 deterministic seed.\n\n**완료 기준:** 서로 다른 설계에서 실측한 비교 지표를 내며 같은 seed에서 결과 재현.\n\n## M2: 실험 도구 및 학습 경험\n- 장애물 직접 편집.\n- 동등한 초기조건 A/B 비교.\n- 예측 -> 실험 -> 결과 해석 -> 다음 질문.\n- 안내형 미션 2~3개 + 자유 실험 모드.\n- 단순화된 모델의 한계 설명.\n\n**완료 기준:** 학생이 한 변수를 통제해 두 실험을 비교하고 이유를 설명할 수 있음.\n\n## M3: 원리/탐구 깊이 엔진\n- 원리별 선수 개념과 교차 연결.\n- Discover, Experiment, Analyze, Create, Go Further.\n- 학년으로 잠금하지 않는 선택/추천 동선.\n- 두 번째 실험 모듈: Motion Lab 또는 Pattern Lab 후보.\n\n**완료 기준:** 하나의 원리에서 깊이를 조절하고 다른 원리로 이동 가능한 학습 경로.\n\n## M4: 어린이 대상 검증\n- 실제 아동/보호자/교사와 사용성 확인.\n- 사전/사후 설명 및 전이 과제 비교.\n- Sandbox vs Guided Inquiry vs Mission 학습 방식 실험.\n- 접근성, 연령별 문해력, 재미와 인지 부하 확인.\n\n**완료 기준:** 재미 외에 학습 이해도에 대한 관찰 근거 축적.\n\n\n\n## 의도적으로 미루는 것\n- AI 자유 대화 시스템\n- 장기 학습 데이터 수집 및 개인 프로필\n- 지도 API를 억지로 추가\n- 학교용 관리자 기능/결제/멀티플레이\n- 현실의 인명 안전 결정을 위한 군중 모델 사용\n";
  const show = () => document.getElementById("doc").innerHTML = window.marked ? marked.parse(MD) : "<pre>" + MD.replace(/[&<]/g, c => c === "&" ? "&amp;" : "&lt;") + "</pre>";
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js";
  s.onload = s.onerror = show;
  document.head.appendChild(s);
</script>
